name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: 'Build macOS'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # Workaround para flutter/flutter#191575: en stable, el windowing nunca
      # está activo (master-only), pero TFA retiene `_Rect` y gen_snapshot se
      # cuelga en macOS release. Forzamos la constante a false en el SDK.
      - name: Patch windowing gen_snapshot crash
        shell: bash
        working-directory: .
        run: |
          F="$FLUTTER_ROOT/packages/flutter/lib/src/foundation/_features.dart"
          FGREP="bool isWindowingEnabled = debugEnabledFeatureFlags.contains('windowing');"
          if grep -qF "$FGREP" "$F"; then
            sed -i '' "s|$FGREP|const bool isWindowingEnabled = false;|" "$F"
            rm -rf "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot" 2>/dev/null || true
          fi
      - run: flutter pub get
      - run: flutter build macos --release
      # Binarios del motor integrados junto al ejecutable (el motor los
      # encuentra sin PATH; yt-dlp se auto-actualiza vía Ajustes). La .app es
      # universal: un ffmpeg por arquitectura.
      - name: Bundle engine binaries (yt-dlp + ffmpeg)
        shell: bash
        run: |
          APP=build/macos/Build/Products/Release/OfflineAudio.app/Contents/MacOS
          curl -sSL --fail --retry 3 --retry-all-errors -o "$APP/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x "$APP/yt-dlp"
          curl -sSL --fail --retry 3 --retry-all-errors -o /tmp/ff-arm64.zip "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-osx-arm64.zip"
          curl -sSL --fail --retry 3 --retry-all-errors -o /tmp/ff-x64.zip "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/ffmpeg-osx-x64.zip"
          unzip -p /tmp/ff-arm64.zip ffmpeg > "$APP/ffmpeg-aarch64"
          unzip -p /tmp/ff-x64.zip ffmpeg > "$APP/ffmpeg-x86_64"
          chmod +x "$APP/ffmpeg-aarch64" "$APP/ffmpeg-x86_64"
          "$APP/yt-dlp" --version
          "$APP/ffmpeg-aarch64" -version 2>&1 | head -n 1
      - name: Bundle
        run: |
          mkdir -p ../dist
          cd build/macos/Build/Products/Release
          hdiutil create -volname OfflineAudio -srcfolder OfflineAudio.app \
            -ov -format UDZO "$GITHUB_WORKSPACE/dist/OfflineAudio-macos.dmg"
          zip -qr "$GITHUB_WORKSPACE/dist/OfflineAudio-macos.zip" "OfflineAudio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/OfflineAudio-macos.zip
            dist/OfflineAudio-macos.dmg

  windows:
    name: 'Build Windows'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths (cargokit/Rust supera MAX_PATH sin esto)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # En Windows, MSBuild se traga el stderr del custom build de cargokit
      # (solo se ve "exited with code -1"). Pre-compilamos la lib aquí con el
      # MISMO env que genera cargokit.cmake para ver errores reales; además,
      # la cachea en CARGOKIT_TARGET_TEMP_DIR para que el paso de flutter sea
      # incremental (las rutas coinciden con las que usa build_tool).
      - name: Pre-build Rust lib (y exponer errores de cargokit)
        shell: pwsh
        working-directory: flutter
        run: |
          $repoRoot = (Resolve-Path '..').Path
          $cargokitRoot = "$repoRoot\flutter\rust_builder\cargokit"
          $manifestDir = "$repoRoot\rust"
          $temp = "$repoRoot\flutter\build\windows\x64\cargokit_build"
          $toolTemp = "$temp\tool"
          $out = "$repoRoot\flutter\build\windows\x64\Release"
          New-Item -ItemType Directory -Force -Path $toolTemp,$out | Out-Null
          $env:CARGOKIT_CMAKE = (Get-Command cmake.exe).Source
          $env:CARGOKIT_CONFIGURATION = 'Release'
          $env:CARGOKIT_MANIFEST_DIR = $manifestDir
          $env:CARGOKIT_TARGET_TEMP_DIR = $temp
          $env:CARGOKIT_OUTPUT_DIR = $out
          $env:CARGOKIT_TARGET_PLATFORM = 'windows-x64'
          $env:CARGOKIT_TOOL_TEMP_DIR = $toolTemp
          $env:CARGOKIT_ROOT_PROJECT_DIR = "$repoRoot\flutter"
          cargo build --manifest-path "$manifestDir\Cargo.toml" -p offline_audio --release `
            --target x86_64-pc-windows-msvc --target-dir "$temp"
          if ($LASTEXITCODE -ne 0) { Write-Error "cargo falló ($LASTEXITCODE)"; exit $LASTEXITCODE }
          cmd /c "call ""$cargokitRoot\run_build_tool.cmd"" build-cmake" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "run_build_tool falló ($LASTEXITCODE)"; exit $LASTEXITCODE }
          Get-ChildItem -Path $out | Select-Object -ExpandProperty Name
      - run: flutter pub get
      - run: flutter build windows --release
      # Binarios del motor integrados: yt-dlp oficial + ffmpeg (gyan
      # essentials). El motor los encuentra junto al .exe sin tocar el PATH;
      # yt-dlp además se auto-actualiza (`yt-dlp -U`) vía Ajustes.
      - name: Bundle engine binaries (yt-dlp + ffmpeg)
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$out\yt-dlp.exe" -MaximumRetryCount 3 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip" -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ff" -Force
          Copy-Item "$env:RUNNER_TEMP\ff\ffmpeg-*-essentials_build\bin\ffmpeg.exe" "$out\ffmpeg.exe"
          & "$out\yt-dlp.exe" --version
          & "$out\ffmpeg.exe" -version 2>&1 | Select-Object -First 1
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\dist\OfflineAudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/OfflineAudio-windows.zip

  linux:
    name: 'Build Linux'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - run: flutter pub get
      - run: flutter build linux --release
      # Binarios del motor integrados junto al ejecutable (el motor los
      # encuentra sin PATH; yt-dlp se auto-actualiza vía Ajustes).
      - name: Bundle engine binaries (yt-dlp + ffmpeg)
        run: |
          BUNDLE=build/linux/x64/release/bundle
          curl -sSL --fail --retry 3 --retry-all-errors -o "$BUNDLE/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp"
          chmod +x "$BUNDLE/yt-dlp"
          # johnvansickle (ligero) con fallback a BtbN (GitHub) si la
          # descarga llega corrupta o el host falla.
          if curl -sSL --fail --retry 3 --retry-all-errors -o /tmp/ff-static.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            && tar -xJf /tmp/ff-static.tar.xz -C /tmp --wildcards '*/ffmpeg' \
            && cp /tmp/ffmpeg-*-static/ffmpeg "$BUNDLE/ffmpeg"; then
            echo "ffmpeg desde johnvansickle"
          else
            echo "johnvansickle falló; usando fallback BtbN"
            rm -rf /tmp/ffmpeg-*-static
            curl -sSL --fail --retry 3 --retry-all-errors -o /tmp/ff-static.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xJf /tmp/ff-static.tar.xz -C /tmp 'ffmpeg-master-latest-linux64-gpl/bin/ffmpeg'
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg "$BUNDLE/ffmpeg"
          fi
          chmod +x "$BUNDLE/ffmpeg"
          "$BUNDLE/yt-dlp" --version
          "$BUNDLE/ffmpeg" -version 2>&1 | head -n 1
      - name: Bundle
        run: |
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/dist/OfflineAudio-linux.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/OfflineAudio-linux.tar.gz

  android:
    name: 'Build Android (APK + AAB)'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      # El NDK exacto que espera flutter.ndkVersion.
      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" "ndk;28.2.13676358" > /dev/null || true
      - name: Android keystore
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/android-keystore.jks"
            echo "KEYSTORE_PATH=$HOME/android-keystore.jks" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Bundle
        shell: bash
        run: |
          mkdir -p ../dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "../dist/OfflineAudio-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab ../dist/OfflineAudio-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  iphone:
    name: 'Build iOS (IPA)'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Detect signing identity
        shell: bash
        # Anula el working-directory por defecto: este paso corre ANTES del
        # checkout y "flutter/" aún no existe.
        working-directory: .
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ]; then
            echo "No Apple signing secrets; skipping iOS build."
            echo "SKIP_IOS=true" >> "$GITHUB_ENV"
          fi
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      - uses: actions/checkout@v4
      # Con secretos: IPA firmado (app-store connect). Sin secretos: IPA sin
      # firmar para AltStore/Sideloadly.
      - name: Rust targets (iOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Import signing identity
        if: env.SKIP_IOS != 'true'
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/apple_dist.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILES_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles.tar"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tar -xf "$RUNNER_TEMP/profiles.tar" -C ~/Library/MobileDevice/Provisioning\ Profiles
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILES_BASE64: ${{ secrets.PROVISIONING_PROFILES_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Export options
        if: env.SKIP_IOS != 'true'
        shell: bash
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$EXPORT_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
        env:
          EXPORT_TEAM_ID: ${{ secrets.EXPORT_TEAM_ID }}
      - run: flutter build ipa --release --export-options-plist=exportOptions.plist
        if: env.SKIP_IOS != 'true'
      - name: Bundle (firmado)
        if: env.SKIP_IOS != 'true'
        run: |
          mkdir -p ../dist
          cp build/ios/ipa/*.ipa ../dist/OfflineAudio-ios.ipa
      # Sin secretos de firma: IPA sin firmar, instalable con AltStore/
      # Sideloadly (ambos firman con la cuenta Apple del usuario).
      - name: Build IPA sin firmar
        if: env.SKIP_IOS == 'true'
        run: flutter build ios --release --no-codesign
      - name: Bundle (AltStore/Sideloadly)
        if: env.SKIP_IOS == 'true'
        run: |
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../dist/OfflineAudio-ios-altstore.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iphone
          path: dist/
        if: always()

  # Runtime autocontenido de yt-dlp para Android (no existe build oficial:
  # bionic). Cada zip lleva el launcher `ytdlp` + CPython de python.org + el
  # wheel de yt-dlp; la app lo descarga a <bin_dir>/ytdlp desde Ajustes >
  # Paquetes (`binary.ytdlp_url`, con default a estos assets). OJO: el default
  # del motor apunta a `releases/latest/download/...`, que solo resuelve
  # cuando el release deja de ser draft y se marca como latest: hay que
  # publicar el draft a mano tras revisar los artefactos.
  ytdlp-runtime:
    name: 'yt-dlp runtime Android (${{ matrix.abi }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      # El NDK exacto que espera flutter.ndkVersion; el script lo localiza
      # vía ANDROID_HOME (igual que el job android).
      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" "ndk;28.2.13676358" > /dev/null || true
      - name: Build runtime
        shell: bash
        run: |
          chmod +x flutter/tool/android/build_ytdlp_runtime.sh
          # El pin vive en runtime_versions.env; el motor lleva los mismos
          # consts en Rust. Si alguien bumpea uno sin el otro, falla aquí
          # en vez de en el móvil del usuario.
          . flutter/tool/android/runtime_versions.env
          grep -q "\"$YTDLP_VERSION\"" rust/src/engine/process.rs \
            || { echo "process.rs YTDLP_RUNTIME_YTDLP_VERSION != $YTDLP_VERSION (runtime_versions.env)" >&2; exit 1; }
          grep -q "\"${PYTHON_VERSION%.*}\"" rust/src/engine/process.rs \
            || { echo "process.rs YTDLP_RUNTIME_PYTHON_MM != ${PYTHON_VERSION%.*}" >&2; exit 1; }
          ./flutter/tool/android/build_ytdlp_runtime.sh "${{ matrix.abi }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ytdlp-runtime-${{ matrix.abi }}
          path: dist/OfflineAudio-ytdlp-${{ matrix.abi }}.zip

  publish:
    name: 'Create GitHub Release'
    needs: [macos, windows, linux, android, iphone, ytdlp-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
            artifacts/**/*.dmg