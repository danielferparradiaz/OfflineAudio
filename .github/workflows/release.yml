name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    name: 'Build macOS'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Bundle
        run: |
          mkdir -p ../dist
          cd build/macos/Build/Products/Release
          zip -qr "$GITHUB_WORKSPACE/dist/OfflineAudio-macos.zip" "OfflineAudio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/OfflineAudio-macos.zip

  windows:
    name: 'Build Windows'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\dist\OfflineAudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/OfflineAudio-windows.zip

  linux:
    name: 'Build Linux'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle
        run: |
          mkdir -p ../dist
          tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/dist/OfflineAudio-linux.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/OfflineAudio-linux.tar.gz

  android:
    name: 'Build Android (APK + AAB)'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Android keystore
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/android-keystore.jks"
            echo "KEYSTORE_PATH=$HOME/android-keystore.jks" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: flutter build appbundle --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Bundle
        shell: bash
        run: |
          mkdir -p ../dist
          for f in build/app/outputs/flutter-apk/app-*.apk; do
            abi=$(basename "$f" | sed -E 's/app-([a-z0-9]+)-release.apk/\1/')
            cp "$f" "../dist/OfflineAudio-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab ../dist/OfflineAudio-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  iphone:
    name: 'Build iOS (IPA)'
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Detect signing identity
        shell: bash
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ]; then
            echo "No Apple signing secrets; skipping iOS build."
            echo "SKIP_IOS=true" >> "$GITHUB_ENV"
          fi
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
      - uses: actions/checkout@v4
        if: env.SKIP_IOS != 'true'
      - uses: subosito/flutter-action@v2
        if: env.SKIP_IOS != 'true'
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP_IOS != 'true'
      - name: Import signing identity
        if: env.SKIP_IOS != 'true'
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/apple_dist.p12"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILES_BASE64" | base64 --decode > "$RUNNER_TEMP/profiles.tar"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tar -xf "$RUNNER_TEMP/profiles.tar" -C ~/Library/MobileDevice/Provisioning\ Profiles
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILES_BASE64: ${{ secrets.PROVISIONING_PROFILES_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      - run: flutter pub get
        if: env.SKIP_IOS != 'true'
      - name: Export options
        if: env.SKIP_IOS != 'true'
        shell: bash
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$EXPORT_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
        env:
          EXPORT_TEAM_ID: ${{ secrets.EXPORT_TEAM_ID }}
      - run: flutter build ipa --release --export-options-plist=exportOptions.plist
        if: env.SKIP_IOS != 'true'
      - name: Bundle
        if: env.SKIP_IOS != 'true'
        run: |
          mkdir -p ../dist
          cp build/ios/ipa/*.ipa ../dist/OfflineAudio-ios.ipa
      - uses: actions/upload-artifact@v4
        if: env.SKIP_IOS != 'true'
        with:
          name: iphone
          path: dist/OfflineAudio-ios.ipa

  publish:
    name: 'Create GitHub Release'
    needs: [macos, windows, linux, android, iphone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa